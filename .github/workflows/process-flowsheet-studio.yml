name: Process Flowsheet Studio

on:
  pull_request:
    paths:
      - "welcome.py"
      - "pages/00_NeqSim_Studio.py"
      - "pages/10_Studio_Results.py"
      - "pages/25_Pipeline.py"
      - "pages/35_Process_Flowsheet_Studio.py"
      - "pages/90_Process_Chat.py"
      - "pipeline_hydraulics.py"
      - "studio/**"
      - "process_chat/process_builder.py"
      - "process_chat/flowsheet_editor.py"
      - "process_chat/graph_schema.py"
      - "process_chat/runtime_imports.py"
      - "process_chat/solver_diagnostics.py"
      - "process_chat/subflowsheet_schema.py"
      - "process_chat/process_model.py"
      - "process_chat/studio_context.py"
      - "tests/test_process_chat_studio_handoff.py"
      - "tests/test_process_chat_studio_context.py"
      - "tests/test_studio_navigation.py"
      - "tests/test_studio_results_context.py"
      - "tests/test_studio_results_shell.py"
      - "tests/test_studio_study_context.py"
      - "tests/test_studio_shell.py"
      - "tests/test_studio_workspace_performance.py"
      - "tests/profile_studio_workspace_browser.py"
      - "tests/test_studio_accessibility_browser.py"
      - "tests/test_studio_full_pilot_browser.py"
      - "tests/fixtures/studio_large_results_browser_app.py"
      - "tests/test_studio_case_interoperability.py"
      - "tests/test_studio_workspace_interactions.py"
      - "tests/test_workspace_http_health.py"
      - "tests/test_flowsheet_editor.py"
      - "tests/test_material_stream_identity.py"
      - "tests/test_process_graph_conservation.py"
      - "tests/test_process_execution.py"
      - "tests/test_pipeline_hydraulics.py"
      - "tests/test_runtime_imports.py"
      - "tests/test_solver_diagnostics.py"
      - "tests/test_studio_warm_deployment.py"
      - "tests/test_subflowsheet_schema.py"
      - ".github/workflows/process-flowsheet-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native NeqSim
        run: |
          python -m pip install --upgrade pip
          python -m pip install neqsim "streamlit>=1.30.0" xlsxwriter google-genai
      - name: Compile affected Python sources
        run: |
          python -m py_compile \
            welcome.py \
            pages/00_NeqSim_Studio.py \
            pages/10_Studio_Results.py \
            pages/25_Pipeline.py \
            pages/35_Process_Flowsheet_Studio.py \
            pages/90_Process_Chat.py \
            pipeline_hydraulics.py \
            studio/case_context.py \
            studio/navigation.py \
            studio/results_context.py \
            studio/study_context.py \
            process_chat/process_builder.py \
            process_chat/flowsheet_editor.py \
            process_chat/graph_schema.py \
            process_chat/runtime_imports.py \
            process_chat/solver_diagnostics.py \
            process_chat/subflowsheet_schema.py \
            process_chat/process_model.py \
            process_chat/studio_context.py \
            tests/test_process_chat_studio_handoff.py \
            tests/test_process_chat_studio_context.py \
            tests/test_studio_case_context.py \
            tests/test_studio_case_interoperability.py \
            tests/test_studio_navigation.py \
            tests/test_studio_results_context.py \
            tests/test_studio_results_shell.py \
            tests/test_studio_study_context.py \
            tests/test_studio_shell.py \
            tests/test_studio_workspace_performance.py \
            tests/test_studio_workspace_interactions.py \
            tests/test_workspace_http_health.py \
            tests/test_flowsheet_editor.py \
            tests/test_material_stream_identity.py \
            tests/test_process_graph_conservation.py \
            tests/test_process_execution.py \
            tests/test_pipeline_hydraulics.py \
            tests/test_runtime_imports.py \
            tests/test_solver_diagnostics.py \
            tests/test_studio_warm_deployment.py \
            tests/test_subflowsheet_schema.py
      - name: Run Studio workspace navigation regressions
        run: python tests/test_studio_navigation.py -v
      - name: Run shared Studio case lifecycle regressions
        run: python tests/test_studio_case_context.py -v
      - name: Run Studio case migration interoperability regressions
        run: python tests/test_studio_case_interoperability.py -v
      - name: Run professional Studio result regressions
        run: |
          python tests/test_studio_results_context.py -v
          python tests/test_studio_results_shell.py -v
          python tests/test_studio_study_context.py -v
      - name: Run Process Chat Studio handoff regressions
        run: |
          python tests/test_process_chat_studio_handoff.py -v
          python tests/test_process_chat_studio_context.py -v
      - name: Run Studio shell smoke test
        run: python tests/test_studio_shell.py -v
      - name: Run large Studio workspace performance baselines
        run: python tests/test_studio_workspace_performance.py -v
      - name: Run Classic and Studio cross-page interaction regressions
        run: python tests/test_studio_workspace_interactions.py -v
      - name: Run Classic and Studio HTTP health regressions
        run: python tests/test_workspace_http_health.py -v
      - name: Run deployment-safe import regression tests
        run: python tests/test_runtime_imports.py -v
      - name: Run warm-deployment Streamlit smoke test
        run: python tests/test_studio_warm_deployment.py -v
      - name: Run draft graph editor regression tests
        run: python tests/test_flowsheet_editor.py -v
      - name: Run named material stream regression tests
        run: python tests/test_material_stream_identity.py -v
      - name: Run solver diagnostic adapter tests
        run: python tests/test_solver_diagnostics.py -v
      - name: Run subflowsheet schema regression tests
        run: python tests/test_subflowsheet_schema.py -v
      - name: Run native multi-inlet conservation benchmark
        run: python tests/test_process_graph_conservation.py -v
      - name: Run bounded execution regressions
        run: python tests/test_process_execution.py -v
      - name: Run native pipeline hydraulics regressions
        run: python tests/test_pipeline_hydraulics.py -v

  studio-browser-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser-profile dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install neqsim "streamlit>=1.30.0" pandas playwright xlsxwriter google-genai
          python -m playwright install --with-deps chromium
      - name: Compile browser-profile sources
        run: |
          python -m py_compile \
            tests/fixtures/studio_large_results_browser_app.py \
            tests/profile_studio_workspace_browser.py \
            tests/test_studio_accessibility_browser.py
      - name: Profile representative large solved workspace in Chromium
        run: python tests/profile_studio_workspace_browser.py
      - name: Exercise Classic and Studio responsive accessibility
        run: python tests/test_studio_accessibility_browser.py
      - name: Retain browser profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-large-workspace-browser-profile
          path: studio-browser-profile.json
          if-no-files-found: error
      - name: Retain responsive accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-responsive-accessibility-browser
          path: studio-accessibility-browser.json
          if-no-files-found: error

  studio-full-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install full-pilot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install neqsim "streamlit>=1.30.0" pandas playwright xlsxwriter google-genai
          python -m playwright install --with-deps chromium
      - name: Compile full-pilot source
        run: python -m py_compile tests/test_studio_full_pilot_browser.py
      - name: Exercise full Studio solve, export, and Process Chat pilot
        run: python tests/test_studio_full_pilot_browser.py
      - name: Retain full Studio pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-full-pilot-browser
          path: studio-full-pilot-browser.json
          if-no-files-found: error
