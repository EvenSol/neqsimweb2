name: Process Flowsheet Studio

on:
  pull_request:
    paths:
      - "welcome.py"
      - "pages/00_NeqSim_Studio.py"
      - "pages/35_Process_Flowsheet_Studio.py"
      - "studio/**"
      - "process_chat/process_builder.py"
      - "process_chat/flowsheet_editor.py"
      - "process_chat/graph_schema.py"
      - "process_chat/runtime_imports.py"
      - "process_chat/solver_diagnostics.py"
      - "process_chat/subflowsheet_schema.py"
      - "process_chat/process_model.py"
      - "tests/test_studio_navigation.py"
      - "tests/test_studio_shell.py"
      - "tests/test_flowsheet_editor.py"
      - "tests/test_material_stream_identity.py"
      - "tests/test_process_graph_conservation.py"
      - "tests/test_process_execution.py"
      - "tests/test_runtime_imports.py"
      - "tests/test_solver_diagnostics.py"
      - "tests/test_studio_warm_deployment.py"
      - "tests/test_subflowsheet_schema.py"
      - ".github/workflows/process-flowsheet-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native NeqSim
        run: |
          python -m pip install --upgrade pip
          python -m pip install neqsim "streamlit>=1.30.0" xlsxwriter
      - name: Compile affected Python sources
        run: |
          python -m py_compile \
            welcome.py \
            pages/00_NeqSim_Studio.py \
            pages/35_Process_Flowsheet_Studio.py \
            studio/navigation.py \
            process_chat/process_builder.py \
            process_chat/flowsheet_editor.py \
            process_chat/graph_schema.py \
            process_chat/runtime_imports.py \
            process_chat/solver_diagnostics.py \
            process_chat/subflowsheet_schema.py \
            process_chat/process_model.py \
            tests/test_studio_navigation.py \
            tests/test_studio_shell.py \
            tests/test_flowsheet_editor.py \
            tests/test_material_stream_identity.py \
            tests/test_process_graph_conservation.py \
            tests/test_process_execution.py \
            tests/test_runtime_imports.py \
            tests/test_solver_diagnostics.py \
            tests/test_studio_warm_deployment.py \
            tests/test_subflowsheet_schema.py
      - name: Run Studio workspace navigation regressions
        run: python tests/test_studio_navigation.py -v
      - name: Run Studio shell smoke test
        run: python tests/test_studio_shell.py -v
      - name: Run deployment-safe import regression tests
        run: python tests/test_runtime_imports.py -v
      - name: Run warm-deployment Streamlit smoke test
        run: python tests/test_studio_warm_deployment.py -v
      - name: Run draft graph editor regression tests
        run: python tests/test_flowsheet_editor.py -v
      - name: Run named material stream regression tests
        run: python tests/test_material_stream_identity.py -v
      - name: Run solver diagnostic adapter tests
        run: python tests/test_solver_diagnostics.py -v
      - name: Run subflowsheet schema regression tests
        run: python tests/test_subflowsheet_schema.py -v
      - name: Run native multi-inlet conservation benchmark
        run: python tests/test_process_graph_conservation.py -v
      - name: Run bounded execution regressions
        run: python tests/test_process_execution.py -v
